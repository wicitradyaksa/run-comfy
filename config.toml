# run-comfy config. Secrets go in .env (RUNPOD_API_KEY=...), never here.

[runpod]
name_prefix = "run-comfy"            # every pod we create is named run-comfy-N (used by `cleanup`)
# Tried in order until one has capacity. `python -m run_comfy gpus` lists valid ids.
gpu_types = ["NVIDIA GeForce RTX 4090", "NVIDIA RTX A6000", "NVIDIA L40S"]
cloud_type = "SECURE"              # SECURE | COMMUNITY | ALL
# ONE of these is required: a RunPod template id, or a Docker image that starts ComfyUI on :8188
template_id = ""
image = ""
# Strongly recommended: a network volume that already holds your models, so pods boot in
# ~1-3 min instead of re-downloading 20-60 GB every run. Pods must be in the volume's DC.
network_volume_id = ""
data_center_id = ""
container_disk_gb = 40
comfy_port = 8188
hourly_rate_estimate_usd = 0.80    # used only if RunPod doesn't report the price
# env = { HF_TOKEN = "..." }       # extra env vars passed to the pod

[pipeline]
# "pod": rent whole GPUs for the batch (best for big batches, custom images, full control)
# "serverless": RunPod Serverless + worker-comfyui (no pods to manage, per-second billing, scales to 0)
backend = "pod"
workflow = "workflows/workflow_api.json"   # ComfyUI "Export (API)" JSON with {{placeholders}}
jobs = "jobs.csv"
output_dir = "output"
pods = 1                 # >1 = parallel GPUs; the queue is shared between them
inflight_per_pod = 2     # jobs queued on each ComfyUI at once (keeps the GPU busy)
max_retries = 2          # per job, for OOM / transient errors (VRAM is freed before retry)
boot_timeout_s = 1200
job_timeout_s = 1800
max_pod_restarts = 1     # replace a pod that dies mid-run
# Hard safety stops - pods are terminated when either is hit
max_runtime_min = 240
max_spend_usd = 25.0

[serverless]
endpoint_id = ""                   # `python -m run_comfy serverless-setup` creates the endpoint and fills this in
max_concurrent = 3                 # requests in flight; keep <= workers_max
cost_per_sec_usd = 0.00031         # estimate per active worker, for the budget guard - check your endpoint's price
# --- only used by serverless-setup ---
image = ""                         # e.g. "runpod/worker-comfyui:<version>-base"; see the worker-comfyui releases page
gpu_ids = "ADA_24,AMPERE_24"       # RunPod serverless GPU pools, in preference order
workers_max = 3
idle_timeout_s = 5                 # seconds a worker stays warm after its last job
network_volume_id = ""             # same models volume as the pod backend; mounted at /runpod-volume
container_disk_gb = 20

[post]
concat = false           # stitch all output videos (CSV order) into one file with ffmpeg
concat_output = "final.mp4"
loudnorm = true

# ---------------------------------------------------------------------------
# Content factory (dashboard: `python -m run_comfy serve`, CLI: `python -m run_comfy batch new ...`)
# ---------------------------------------------------------------------------
[factory]
data_dir = "data"                  # SQLite db, assets, stage cache, exports
workflows_dir = "workflows"        # workflows/<name>/{workflow_api.json, manifest.toml}
backend = "demo"                   # demo (free placeholders) | serverless | pod | url
comfy_url = ""                     # for backend = "url" (an existing ComfyUI)
max_parallel_variants = 4
max_spend_usd = 25.0               # default per-batch budget; GPUs are released when it's hit
anthropic_model = "claude-opus-5-5"
qa = true                          # technical checks always; Claude vision review if ANTHROPIC_API_KEY is set
qa_threshold = 7
qa_max_regens = 1
target_lufs = -14.0
caption_style = "bold_pop"         # bold_pop | karaoke | minimal | none

[voice]
provider = "demo"                  # demo | elevenlabs (ELEVENLABS_API_KEY) | comfy (your TTS workflow)
elevenlabs_model = "eleven_multilingual_v2"
comfy_workflow = "tts"

[storage]
s3_bucket = ""                     # set to upload exports to S3 / R2 (AWS_* env vars for credentials)
s3_prefix = "run-comfy/"
s3_endpoint_url = ""
public_base_url = ""

[webhooks]
url = ""                           # receives signed batch.* / variant.completed events
secret = ""                        # "whsec_..." (Standard Webhooks)
