[project]
name = "run-comfy"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "runpod>=1.7", "httpx>=0.27", "websockets>=13", "fastapi>=0.115", "uvicorn>=0.30",
    "python-multipart>=0.0.9", "sqlmodel>=0.0.22", "anthropic>=1.14", "pydantic>=2",
    "pysubs2>=1.7", "pillow>=10", "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
whisper = ["faster-whisper>=1.0"]   # word timings for captions when the voice provider has none
s3 = ["boto3>=1.34"]

[project.scripts]
run-comfy = "run_comfy.cli:main"
run-comfy-mcp = "run_comfy.mcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["run_comfy", "run_comfy.backends", "run_comfy.factory", "run_comfy.factory.recipes"]

[tool.setuptools.package-data]
run_comfy = ["web_dist/*", "web_dist/assets/*"]
