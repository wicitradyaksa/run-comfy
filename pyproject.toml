[project]
name = "bulkgen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["runpod>=1.7", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
bulkgen = "bulkgen.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bulkgen"]
