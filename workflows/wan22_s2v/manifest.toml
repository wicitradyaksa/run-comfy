# Wan 2.2 S2V-14B: presenter photo + voice-over -> talking-head video
name = "wan22_s2v"
kind = "talking"
description = "Speech-driven talking head; frame count follows the VO length. Graph written against ComfyUI core node names; run `run_comfy workflows check --url` on a live pod before relying on it."
license = "Apache-2.0 (needs likeness rights for real people)"
commercial_ok = true
min_vram_gb = 48
est_seconds = 420
verified = false

[inputs.image]
type = "image"
node = "7.inputs.image"

[inputs.audio]
type = "audio"
node = "5.inputs.audio"

[inputs.prompt]
type = "text"
node = "8.inputs.text"
default = "a person talking to camera, natural expressions, handheld UGC selfie video"

[inputs.seed]
type = "int"
node = "12.inputs.seed"
default = -1

[inputs.length]
type = "int"
node = "10.inputs.length"
derive = "wan_frames:audio:16"

[inputs.width]
type = "int"
node = "10.inputs.width"
default = 480

[inputs.height]
type = "int"
node = "10.inputs.height"
default = 832

